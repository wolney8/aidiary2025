<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenMynd</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      try {
        const preference =
          localStorage.getItem("openmynd_theme_mode") ||
          localStorage.getItem("ai_diary_theme_mode") ||
          "auto";
        const preset =
          localStorage.getItem("openmynd_theme_preset") ||
          localStorage.getItem("ai_diary_theme_preset") ||
          "default";
        const mode = preference === "dark" || preference === "light"
          ? preference
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.setAttribute("data-theme-preset", preset);
        document.documentElement.style.colorScheme = mode;
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.setAttribute("data-theme-preset", "default");
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root>Loading ...</app-root>
</body>
</html>
